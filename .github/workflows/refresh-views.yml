name: Refresh view counts

# Re-reads YouTube view counts, rebuilds, and commits if the numbers moved.
#
# Needs a YOUTUBE_API_KEY repository secret: YouTube withholds view counts from
# datacenter IPs, so the watch-page scrape that works locally returns nothing here.
# Without the secret this job still succeeds but reports that nothing could be read
# and leaves the cached values in place.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # secrets is not a valid context in `if`, so the check happens in the shell.
      - name: Note whether an API key is available
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::No YOUTUBE_API_KEY secret; counts cannot be refreshed from CI"
          fi

      - name: Refresh counts and rebuild
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/build.py --refresh-views | tee /tmp/build.log

      - name: Surface any unreadable video
        run: |
          if grep -q "warn:" /tmp/build.log; then
            echo "::warning::At least one view count could not be read; cached values kept"
          fi

      - run: python src/check.py

      - name: Commit if the counts moved
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "View counts unchanged; nothing to commit."
            exit 0
          fi
          # Identity is derived rather than hardcoded, so no address is stored in the repo.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "Refresh YouTube view counts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not reliably trigger the Pages build,
      # so request one explicitly.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
