name: Refresh view counts

# Re-reads YouTube view counts, rebuilds, and commits if the numbers moved.
# If YouTube declines to serve the runner, build.py warns and keeps the cached
# value, so a failed scrape leaves the site untouched rather than dropping counts.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh counts and rebuild
        run: python src/build.py --refresh-views | tee /tmp/build.log

      - name: Surface a blocked scrape
        run: |
          if grep -q "warn:" /tmp/build.log; then
            echo "::warning::YouTube did not serve at least one video; cached values kept"
          fi

      - run: python src/check.py

      - name: Commit if the counts moved
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "View counts unchanged; nothing to commit."
            exit 0
          fi
          # Identity is derived rather than hardcoded, so no address is stored in the repo.
          git config user.name "github-actions[bot]"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "Refresh YouTube view counts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not reliably trigger the Pages build,
      # so request one explicitly.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
