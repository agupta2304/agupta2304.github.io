<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Applied before first paint so a stored preference never flashes the wrong palette. */
(function () {
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<title>{% block title %}{{ profile.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.meta_description }}{% endblock %}">
<link rel="canonical" href="{{ site.url }}{{ page.path }}">

<meta property="og:type" content="{{ page.og_type | default('website') }}">
<meta property="og:site_name" content="{{ profile.name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site.url }}{{ page.path }}">
{% if profile.headshot %}<meta property="og:image" content="{{ site.url }}{{ profile.headshot }}">{% endif %}
<meta name="twitter:card" content="summary">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" type="application/rss+xml" title="{{ profile.name }} — posts" href="/feed.xml">
{% block head_extra %}{% endblock %}
</head>
<body>

<nav class="nav">
  <div class="nav__inner">
    <a class="nav__home" href="/">{{ profile.name }}</a>
    <a href="/#papers">papers</a>
    <a href="/#talks">talks</a>
    <a href="/#experience">experience</a>
    <a href="/blog/">writing</a>
    <button class="theme-toggle" type="button" hidden>
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 1.7 A6.3 6.3 0 0 1 8 14.3 Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</nav>

<main class="wrap">
{% block content %}{% endblock %}

  <footer class="footer">
    <span>&copy; {{ site.year }} {{ profile.name }}</span>
    <span><a href="/feed.xml">RSS</a></span>
  </footer>
</main>

{% block body_extra %}{% endblock %}

<script>
/* The button stays hidden unless this runs, so it is never dead furniture. */
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  if (!button) return;
  button.hidden = false;

  function describe() {
    var isLight = root.getAttribute("data-theme") === "light";
    var label = isLight ? "Switch to dark theme" : "Switch to cream theme";
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
    button.setAttribute("aria-pressed", isLight ? "true" : "false");
  }

  button.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    describe();
  });

  describe();
})();
</script>
</body>
</html>
