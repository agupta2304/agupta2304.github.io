<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.meta_description }}{% endblock %}">
<link rel="canonical" href="{{ site.url }}{{ page.path }}">

<meta property="og:type" content="{{ page.og_type | default('website') }}">
<meta property="og:site_name" content="{{ profile.name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site.url }}{{ page.path }}">
{% if profile.headshot %}<meta property="og:image" content="{{ site.url }}{{ profile.headshot }}">{% endif %}
<meta name="twitter:card" content="summary">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" type="application/rss+xml" title="{{ profile.name }} — posts" href="/feed.xml">
{% block head_extra %}{% endblock %}
</head>
<body>

<nav class="nav">
  <div class="nav__inner">
    <a class="nav__home" href="/">{{ profile.name }}</a>
    <a href="/#papers">papers</a>
    <a href="/#talks">talks</a>
    <a href="/#experience">experience</a>
    <a href="/blog/">writing</a>
  </div>
</nav>

<main class="wrap">
{% block content %}{% endblock %}

  <footer class="footer">
    <span>&copy; {{ site.year }} {{ profile.name }}</span>
    <span><a href="/feed.xml">RSS</a></span>
  </footer>
</main>

{% block body_extra %}{% endblock %}
</body>
</html>
