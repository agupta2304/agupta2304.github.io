<script>
/* Applied before first paint so a stored preference never flashes the wrong palette. */
(function () {
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>

<script>
/* The button stays hidden unless this runs, so it is never dead furniture. */
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  if (!button) return;
  button.hidden = false;

  function describe() {
    var isDark = root.getAttribute("data-theme") === "dark";
    var label = isDark ? "Switch to cream theme" : "Switch to dark theme";
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
    button.setAttribute("aria-pressed", isDark ? "true" : "false");
  }

  button.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    describe();
  });

  describe();
})();
</script>
